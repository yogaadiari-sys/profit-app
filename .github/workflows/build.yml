name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o ProfitControl_V1_Project.zip -d .

      - name: Apply Fix to MainActivity
        run: |
          cat << 'EOF' > app/src/main/java/com/profitcontrol/app/MainActivity.kt
          package com.profitcontrol.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import java.math.BigDecimal

          data class Product(
              val name: String,
              val cost: BigDecimal,
              val price: BigDecimal
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              ProfitScreen()
                          }
                      }
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ProfitScreen() {
              var productName by remember { mutableStateOf("") }
              var costInput by remember { mutableStateOf("") }
              var priceInput by remember { mutableStateOf("") }
              var productList by remember { mutableStateOf(listOf<Product>()) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Profit Control",
                      style = MaterialTheme.typography.headlineMedium
                  )

                  Spacer(modifier = Modifier.height(16.dp))

                  OutlinedTextField(
                      value = productName,
                      onValueChange = { productName = it },
                      label = { Text("Nama Produk") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = costInput,
                      onValueChange = { costInput = it },
                      label = { Text("Harga Modal (Cost)") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(modifier = Modifier.height(8.dp))

                  OutlinedTextField(
                      value = priceInput,
                      onValueChange = { priceInput = it },
                      label = { Text("Harga Jual (Price)") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(modifier = Modifier.height(16.dp))

                  Button(
                      onClick = {
                          val cost = costInput.toBigDecimalOrNull() ?: BigDecimal.ZERO
                          val price = priceInput.toBigDecimalOrNull() ?: BigDecimal.ZERO
                          if (productName.isNotBlank()) {
                              productList = productList + Product(productName, cost, price)
                              productName = ""
                              costInput = ""
                              priceInput = ""
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Tambah Produk")
                  }

                  Spacer(modifier = Modifier.height(16.dp))

                  LazyColumn(
                      modifier = Modifier.fillMaxSize()
                  ) {
                      items(productList) { product ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 4.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text(text = product.name, style = MaterialTheme.typography.titleMedium)
                                  val profit = product.price - product.cost
                                  Text(text = "Profit: $profit", style = MaterialTheme.typography.bodyMedium)
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitControl-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
