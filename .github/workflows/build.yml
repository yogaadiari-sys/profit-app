Errornya bukan pada dependensi, melainkan **kompilasi kode Kotlin di `MainActivity.kt`**:
1. `Icons.Default.Calculate` dan `Icons.Default.Tune` **tidak ada di paket basic Compose**.
2. Komponen `FilterChip` di Material 3 mewajibkan parameter `label = { Text(...) }` atau memerlukan `@OptIn(ExperimentalMaterial3Api::class)`.
3. Di dalam skrip CI, ketika perintah `./gradlew assembleDebug` gagal, Gradle mencetak *dependency tree* karena opsi default saat terjadi compile error tanpa stacktrace eksplisit.

Ketika build pertama berhasil (tangkapan layar aplikasi yang sudah kamu pasang), kodenya memakai ikon dan struktur yang lebih sederhana tanpa impor icon aneh-aneh.

Kita kembalikan struktur icon yang 100% aman (memakai teks/icon bawaan yang pasti ada di Compose standar) dan menambahkan `@OptIn(ExperimentalMaterial3Api::class)` agar tidak ada error kompilasi. Kita juga pasang flag `--stacktrace` agar jika ada typo langsung tertangkap jelas.

