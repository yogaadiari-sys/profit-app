          // 3. SCREEN SIMULASI (AFFILIATE % & REAKTIVITAS INSTAN)
          @Composable
          fun SimulasiScreen(
              products: List<ProductItem>,
              targetMargin: Double
          ) {
              var selectedProductIndex by remember { mutableIntStateOf(0) }
              var isDropdownExpanded by remember { mutableStateOf(false) }

              val baseProduct = products.getOrNull(selectedProductIndex)

              var simPriceText by remember(baseProduct) { mutableStateOf(baseProduct?.sellingPrice?.toLong()?.toString() ?: "0") }
              var simFeeText by remember(baseProduct) { mutableStateOf(baseProduct?.marketplaceFeePercent?.toString() ?: "0") }
              var simFixedText by remember(baseProduct) { mutableStateOf(baseProduct?.fixedFee?.toLong()?.toString() ?: "0") }
              var simAdsText by remember(baseProduct) { mutableStateOf(baseProduct?.targetAds?.toLong()?.toString() ?: "0") }
              var simAffPercentText by remember(baseProduct) { mutableStateOf(baseProduct?.targetAffiliatePercent?.toString() ?: "0") }

              val beforeResult = remember(baseProduct, targetMargin) {
                  baseProduct?.let {
                      ProfitEngine.calculate(
                          it.sellingPrice, it.cogs, it.marketplaceFeePercent,
                          it.fixedFee, it.packagingCost, it.operationalCost,
                          it.returnReservePercent, it.targetAds, it.targetAffiliatePercent, targetMargin
                      )
                  }
              }

              val afterResult by remember(baseProduct, simPriceText, simFeeText, simFixedText, simAdsText, simAffPercentText, targetMargin) {
                  derivedStateOf {
                      baseProduct?.let {
                          val p = simPriceText.toDoubleOrNull() ?: 0.0
                          val f = simFeeText.toDoubleOrNull() ?: 0.0
                          val fx = simFixedText.toDoubleOrNull() ?: 0.0
                          val a = simAdsText.toDoubleOrNull() ?: 0.0
                          val af = simAffPercentText.toDoubleOrNull() ?: 0.0
                          ProfitEngine.calculate(
                              sellingPrice = p,
                              cogs = it.cogs,
                              marketplaceFeePercent = f,
                              fixedFee = fx,
                              packagingCost = it.packagingCost,
                              operationalCost = it.operationalCost,
                              returnReservePercent = it.returnReservePercent,
                              targetAds = a,
                              targetAffiliatePercent = af,
                              targetMarginDefault = targetMargin
                          )
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Simulator Fee & Biaya",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Text(
                      text = "Pilih produk untuk menguji skenario perubahan harga atau admin.",
                      fontSize = 13.sp,
                      color = Color(0xFF64748B)
                  )
                  Spacer(Modifier.height(14.dp))

                  if (products.isEmpty()) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF3E0))
                      ) {
                          Text(
                              "Belum ada produk tersimpan. Silakan input produk terlebih dahulu di menu Hitung.",
                              modifier = Modifier.padding(16.dp),
                              color = Color(0xFFE65100)
                          )
                      }
                  } else {
                      Box(modifier = Modifier.fillMaxWidth()) {
                          OutlinedButton(
                              onClick = { isDropdownExpanded = true },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(8.dp)
                          ) {
                              Text("Target: ${baseProduct?.name ?: "-"}", color = Color(0xFF006D5B), fontWeight = FontWeight.Bold)
                          }
                          DropdownMenu(
                              expanded = isDropdownExpanded,
                              onDismissRequest = { isDropdownExpanded = false }
                          ) {
                              products.forEachIndexed { idx, p ->
                                  DropdownMenuItem(
                                      text = { Text(p.name) },
                                      onClick = {
                                          selectedProductIndex = idx
                                          isDropdownExpanded = false
                                      }
                                  )
                              }
                          }
                      }

                      Spacer(Modifier.height(12.dp))

                      OutlinedTextField(
                          value = simPriceText,
                          onValueChange = { simPriceText = it },
                          label = { Text("Harga Simulasi (Rp)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.fillMaxWidth()
                      )

                      Spacer(Modifier.height(8.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          OutlinedTextField(
                              value = simFeeText,
                              onValueChange = { simFeeText = it },
                              label = { Text("Fee (%)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.weight(1f).padding(end = 4.dp)
                          )
                          OutlinedTextField(
                              value = simFixedText,
                              onValueChange = { simFixedText = it },
                              label = { Text("Fixed Fee (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(start = 4.dp)
                          )
                      }

                      Spacer(Modifier.height(8.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          OutlinedTextField(
                              value = simAdsText,
                              onValueChange = { simAdsText = it },
                              label = { Text("Iklan (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(end = 4.dp)
                          )
                          OutlinedTextField(
                              value = simAffPercentText,
                              onValueChange = { simAffPercentText = it },
                              label = { Text("Affiliate (%)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.weight(1f).padding(start = 4.dp)
                          )
                      }

                      Spacer(Modifier.height(16.dp))

                      // KOMPARASI SEBELUM VS SESUDAH
                      Row(modifier = Modifier.fillMaxWidth()) {
                          Card(
                              modifier = Modifier.weight(1f).padding(end = 4.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFFF8FAFC)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text("SEBELUM", fontSize = 11.sp, color = Color(0xFF64748B), fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      beforeResult?.let { ProfitEngine.formatRupiah(it.netProfit) } ?: "-",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 15.sp
                                  )
                                  Text("Margin: ${beforeResult?.marginPercent ?: 0}%", fontSize = 12.sp, color = Color(0xFF64748B))
                                  Text("Status: ${beforeResult?.status ?: "-"}", fontSize = 12.sp, fontWeight = FontWeight.SemiBold)
                              }
                          }

                          Card(
                              modifier = Modifier.weight(1f).padding(start = 4.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text("SESUDAH", fontSize = 11.sp, color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      afterResult?.let { ProfitEngine.formatRupiah(it.netProfit) } ?: "-",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 15.sp,
                                      color = Color(0xFF1B5E20)
                                  )
                                  Text("Margin: ${afterResult?.marginPercent ?: 0}%", fontSize = 12.sp, color = Color(0xFF2E7D32))
                                  Text("Status: ${afterResult?.status ?: "-"}", fontSize = 12.sp, fontWeight = FontWeight.SemiBold, color = Color(0xFF1B5E20))
                              }
                          }
                      }

                      Spacer(Modifier.height(14.dp))

                      // DAMPAK PERUBAHAN
                      val diffProfit = if (beforeResult != null && afterResult != null) {
                          afterResult!!.netProfit.subtract(beforeResult.netProfit)
                      } else {
                          BigDecimal.ZERO
                      }

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(
                              containerColor = if (diffProfit >= BigDecimal.ZERO) Color(0xFFE8F5E9) else Color(0xFFFFEBEE)
                          ),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text("DAMPAK PERUBAHAN", fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color(0xFF334155))
                              Spacer(Modifier.height(4.dp))
                              val sign = if (diffProfit > BigDecimal.ZERO) "+" else ""
                              Text(
                                  "Selisih Net Profit: $sign${ProfitEngine.formatRupiah(diffProfit)}",
                                  fontSize = 16.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (diffProfit >= BigDecimal.ZERO) Color(0xFF2E7D32) else Color(0xFFC62828)
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(130.dp))
              }
          }

          // 4. SCREEN PRODUK
          @Composable
          fun ProdukScreen(
              products: List<ProductItem>,
              targetMargin: Double,
              onDeleteProduct: (String) -> Unit
          ) {
              var selectedFilter by remember { mutableStateOf("SEMUA") }

              val calculatedList = remember(products, targetMargin) {
                  products.map { p ->
                      p to ProfitEngine.calculate(
                          p.sellingPrice, p.cogs, p.marketplaceFeePercent,
                          p.fixedFee, p.packagingCost, p.operationalCost,
                          p.returnReservePercent, p.targetAds, p.targetAffiliatePercent, targetMargin
                      )
                  }
              }

              val filteredList = calculatedList.filter { pair ->
                  when (selectedFilter) {
                      "SEHAT" -> pair.second.status == "SEHAT"
                      "TIPIS" -> pair.second.status == "TIPIS"
                      "BONCOS" -> pair.second.status == "BONCOS"
                      else -> true
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Daftar Produk (${products.size})",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Spacer(Modifier.height(12.dp))

                  Row(modifier = Modifier.fillMaxWidth()) {
                      listOf("SEMUA", "SEHAT", "TIPIS", "BONCOS").forEach { filter ->
                          val isSelected = selectedFilter == filter
                          Button(
                              onClick = { selectedFilter = filter },
                              modifier = Modifier
                                  .weight(1f)
                                  .padding(horizontal = 2.dp)
                                  .height(36.dp),
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = if (isSelected) Color(0xFF006D5B) else Color(0xFFE2E8F0)
                              ),
                              contentPadding = PaddingValues(0.dp)
                          ) {
                              Text(
                                  filter,
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isSelected) Color.White else Color(0xFF475569)
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(12.dp))

                  if (filteredList.isEmpty()) {
                      Box(
                          modifier = Modifier.fillMaxSize(),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("Tidak ada produk dalam kategori ini.", color = Color(0xFF94A3B8))
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(bottom = 120.dp)
                      ) {
                          items(filteredList, key = { it.first.id }) { (product, calc) ->
                              val (badgeBg, badgeText) = when (calc.status) {
                                  "SEHAT" -> Color(0xFF2E7D32) to "SEHAT"
                                  "TIPIS" -> Color(0xFFE65100) to "TIPIS"
                                  else -> Color(0xFFC62828) to "BONCOS"
                              }

                              Card(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 6.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color.White),
                                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              product.name.replaceFirstChar { it.uppercase() },
                                              fontSize = 16.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Surface(
                                              color = badgeBg,
                                              shape = RoundedCornerShape(6.dp)
                                          ) {
                                              Text(
                                                  badgeText,
                                                  color = Color.White,
                                                  modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),
                                                  fontWeight = FontWeight.Bold,
                                                  fontSize = 11.sp
                                              )
                                          }
                                      }

                                      Spacer(Modifier.height(4.dp))
                                      Text(
                                          "Harga: ${ProfitEngine.formatRupiah(product.sellingPrice)} | Margin: ${calc.marginPercent}%",
                                          fontSize = 13.sp,
                                          color = Color(0xFF64748B)
                                      )
                                      Spacer(Modifier.height(2.dp))
                                      Text(
                                          "Net Profit: ${ProfitEngine.formatRupiah(calc.netProfit)}",
                                          fontSize = 14.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = if (calc.netProfit >= BigDecimal.ZERO) Color(0xFF2E7D32) else Color(0xFFC62828)
                                      )

                                      Spacer(Modifier.height(6.dp))
                                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {
                                          Text(
                                              "Hapus",
                                              color = Color(0xFFC62828),
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier
                                                  .clickable { onDeleteProduct(product.id) }
                                                  .padding(4.dp)
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

