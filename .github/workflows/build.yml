name: Build Profit Control APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/profitcontrol/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ProfitControl"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.profitcontrol.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.profitcontrol.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.0.2"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Profit Control"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Profit Control</string>
          </resources>
          EOF

      - name: Inject Source Code with UI, Affiliate %, & Scroll Fixes
        run: |
          cat << 'EOF' > app/src/main/java/com/profitcontrol/app/MainActivity.kt
          package com.profitcontrol.app

          import android.content.Context
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import java.io.File
          import java.math.BigDecimal
          import java.math.RoundingMode
          import java.text.NumberFormat
          import java.util.Locale
          import java.util.UUID

          // DATA MODELS
          data class ProductItem(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val sellingPrice: Double,
              val cogs: Double,
              val marketplaceFeePercent: Double,
              val fixedFee: Double,
              val packagingCost: Double,
              val operationalCost: Double,
              val returnReservePercent: Double,
              val targetAds: Double,
              val targetAffiliatePercent: Double // Berubah jadi persen (%)
          )

          data class CalculationResult(
              val netProfit: BigDecimal,
              val marginPercent: BigDecimal,
              val status: String,
              val bepRoas: BigDecimal,
              val maxAdsLimit: BigDecimal,
              val maxAffiliatePercentLimit: BigDecimal,
              val affiliateNominal: BigDecimal
          )

          // ENGINE KEUANGAN BIGDECIMAL
          object ProfitEngine {
              fun calculate(
                  sellingPrice: Double,
                  cogs: Double,
                  marketplaceFeePercent: Double,
                  fixedFee: Double,
                  packagingCost: Double,
                  operationalCost: Double,
                  returnReservePercent: Double,
                  targetAds: Double,
                  targetAffiliatePercent: Double,
                  targetMarginDefault: Double = 20.0
              ): CalculationResult {
                  val price = BigDecimal.valueOf(sellingPrice)
                  val hpp = BigDecimal.valueOf(cogs)
                  val adminPercent = BigDecimal.valueOf(marketplaceFeePercent).divide(BigDecimal("100"), 4, RoundingMode.HALF_UP)
                  val returPercent = BigDecimal.valueOf(returnReservePercent).divide(BigDecimal("100"), 4, RoundingMode.HALF_UP)
                  val affPercent = BigDecimal.valueOf(targetAffiliatePercent).divide(BigDecimal("100"), 4, RoundingMode.HALF_UP)
                  val fixed = BigDecimal.valueOf(fixedFee)
                  val pack = BigDecimal.valueOf(packagingCost)
                  val ops = BigDecimal.valueOf(operationalCost)
                  val ads = BigDecimal.valueOf(targetAds)

                  val adminFeeNominal = price.multiply(adminPercent)
                  val returNominal = price.multiply(returPercent)
                  val affiliateNominal = price.multiply(affPercent).setScale(2, RoundingMode.HALF_UP)

                  val totalCost = hpp.add(adminFeeNominal)
                      .add(fixed)
                      .add(pack)
                      .add(ops)
                      .add(returNominal)
                      .add(ads)
                      .add(affiliateNominal)

                  val netProfit = price.subtract(totalCost).setScale(2, RoundingMode.HALF_UP)

                  val marginPercent = if (price.compareTo(BigDecimal.ZERO) > 0) {
                      netProfit.divide(price, 4, RoundingMode.HALF_UP).multiply(BigDecimal("100")).setScale(2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO
                  }

                  val status = when {
                      netProfit < BigDecimal.ZERO -> "BONCOS"
                      marginPercent >= BigDecimal.valueOf(targetMarginDefault) -> "SEHAT"
                      else -> "TIPIS"
                  }

                  val grossMarginBeforePromo = price.subtract(hpp.add(adminFeeNominal).add(fixed).add(pack).add(ops).add(returNominal))

                  val bepRoas = if (grossMarginBeforePromo > BigDecimal.ZERO && price > BigDecimal.ZERO) {
                      price.divide(grossMarginBeforePromo, 2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO
                  }

                  val maxAds = if (grossMarginBeforePromo.subtract(affiliateNominal) > BigDecimal.ZERO) {
                      grossMarginBeforePromo.subtract(affiliateNominal).setScale(2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO
                  }

                  val maxAffPercent = if (grossMarginBeforePromo.subtract(ads) > BigDecimal.ZERO && price > BigDecimal.ZERO) {
                      grossMarginBeforePromo.subtract(ads).divide(price, 4, RoundingMode.HALF_UP).multiply(BigDecimal("100")).setScale(2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO
                  }

                  return CalculationResult(
                      netProfit = netProfit,
                      marginPercent = marginPercent,
                      status = status,
                      bepRoas = bepRoas,
                      maxAdsLimit = maxAds,
                      maxAffiliatePercentLimit = maxAffPercent,
                      affiliateNominal = affiliateNominal
                  )
              }

              fun formatRupiah(amount: BigDecimal): String {
                  val formatter = NumberFormat.getCurrencyInstance(Locale("in", "ID"))
                  formatter.maximumFractionDigits = 0
                  return formatter.format(amount).replace("Rp", "Rp ")
              }

              fun formatRupiah(amount: Double): String {
                  return formatRupiah(BigDecimal.valueOf(amount))
              }
          }

          // REPOSITORY PERSISTENSI OFFLINE
          class ProfitRepository(private val context: Context) {
              private val file = File(context.filesDir, "profit_control_db.json")
              private val pref = context.getSharedPreferences("profit_prefs", Context.MODE_PRIVATE)
              private val gson = Gson()

              fun getTargetMargin(): Double {
                  return pref.getFloat("target_margin", 20.0f).toDouble()
              }

              fun setTargetMargin(margin: Double) {
                  pref.edit().putFloat("target_margin", margin.toFloat()).apply()
              }

              fun loadProducts(): List<ProductItem> {
                  return try {
                      if (!file.exists()) {
                          val sample = listOf(
                              ProductItem(name = "Kemeja", sellingPrice = 95000.0, cogs = 50000.0, marketplaceFeePercent = 6.5, fixedFee = 1000.0, packagingCost = 2000.0, operationalCost = 1500.0, returnReservePercent = 2.0, targetAds = 5000.0, targetAffiliatePercent = 5.0),
                              ProductItem(name = "Celana", sellingPrice = 90000.0, cogs = 60000.0, marketplaceFeePercent = 8.0, fixedFee = 2000.0, packagingCost = 2000.0, operationalCost = 1500.0, returnReservePercent = 2.0, targetAds = 5000.0, targetAffiliatePercent = 10.0),
                              ProductItem(name = "Sepatu", sellingPrice = 100000.0, cogs = 80000.0, marketplaceFeePercent = 8.5, fixedFee = 1000.0, packagingCost = 2500.0, operationalCost = 1500.0, returnReservePercent = 2.0, targetAds = 5000.0, targetAffiliatePercent = 10.0)
                          )
                          saveProducts(sample)
                          sample
                      } else {
                          val json = file.readText()
                          val type = object : TypeToken<List<ProductItem>>() {}.type
                          gson.fromJson(json, type) ?: emptyList()
                      }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun saveProducts(products: List<ProductItem>) {
                  try {
                      val json = gson.toJson(products)
                      val temp = File(context.filesDir, "profit_control_db.tmp")
                      temp.writeText(json)
                      temp.renameTo(file)
                  } catch (_: Exception) {}
              }

              fun getRawJson(): String {
                  return if (file.exists()) file.readText() else "[]"
              }

              fun restoreRawJson(raw: String): Boolean {
                  return try {
                      val type = object : TypeToken<List<ProductItem>>() {}.type
                      val parsed: List<ProductItem> = gson.fromJson(raw, type)
                      saveProducts(parsed)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }

          // MAIN ACTIVITY
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val repository = ProfitRepository(this)
                  setContent {
                      ProfitControlTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              MainApp(repository)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ProfitControlTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = Color(0xFF006D5B),
                      secondary = Color(0xFF26A69A),
                      background = Color(0xFFFBFDFD),
                      surface = Color(0xFFFFFFFF),
                      surfaceVariant = Color(0xFFF0F4F4),
                      error = Color(0xFFBA1A1A)
                  ),
                  content = content
              )
          }

          enum class NavTab(val title: String, val icon: @Composable () -> Unit) {
              HOME("Home", { Icon(Icons.Default.Home, contentDescription = "Home") }),
              HITUNG("Hitung", { Icon(Icons.Default.AddCircle, contentDescription = "Hitung") }),
              SIMULASI("Simulasi", { Icon(Icons.Default.CheckCircle, contentDescription = "Simulasi") }),
              PRODUK("Produk", { Icon(Icons.Default.List, contentDescription = "Produk") }),
              SETTING("Setting", { Icon(Icons.Default.Settings, contentDescription = "Setting") })
          }

          @Composable
          fun MainApp(repository: ProfitRepository) {
              var currentTab by remember { mutableStateOf(NavTab.HOME) }
              var products by remember { mutableStateOf(repository.loadProducts()) }
              var targetMargin by remember { mutableDoubleStateOf(repository.getTargetMargin()) }

              Scaffold(
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFF005B4C))
                              .padding(top = 36.dp, bottom = 14.dp, start = 16.dp, end = 16.dp)
                      ) {
                          Text(
                              text = "PROFIT CONTROL",
                              fontSize = 20.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          )
                          Text(
                              text = "Omzet besar belum tentu untung.",
                              fontSize = 12.sp,
                              color = Color(0xFFB2DFDB)
                          )
                      }
                  },
                  bottomBar = {
                      NavigationBar(
                          containerColor = Color.White,
                          tonalElevation = 6.dp
                      ) {
                          NavTab.values().forEach { tab ->
                              NavigationBarItem(
                                  selected = currentTab == tab,
                                  onClick = { currentTab = tab },
                                  icon = tab.icon,
                                  label = {
                                      Text(
                                          text = tab.title,
                                          fontSize = 11.sp,
                                          fontWeight = if (currentTab == tab) FontWeight.Bold else FontWeight.Normal
                                      )
                                  },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = Color(0xFF006D5B),
                                      selectedTextColor = Color(0xFF006D5B),
                                      indicatorColor = Color(0xFFE0F2F1),
                                      unselectedIconColor = Color(0xFF757575),
                                      unselectedTextColor = Color(0xFF757575)
                                  )
                              )
                          }
                      }
                  }
              ) { innerPadding ->
                  Box(modifier = Modifier.padding(innerPadding)) {
                      when (currentTab) {
                          NavTab.HOME -> HomeScreen(
                              products = products,
                              targetMargin = targetMargin,
                              onNavigateToHitung = { currentTab = NavTab.HITUNG },
                              onNavigateToSimulator = { currentTab = NavTab.SIMULASI }
                          )
                          NavTab.HITUNG -> HitungScreen(
                              targetMargin = targetMargin,
                              onSaveProduct = { newProduct ->
                                  val updated = products + newProduct
                                  products = updated
                                  repository.saveProducts(updated)
                                  currentTab = NavTab.PRODUK
                              }
                          )
                          NavTab.SIMULASI -> SimulasiScreen(
                              products = products,
                              targetMargin = targetMargin
                          )
                          NavTab.PRODUK -> ProdukScreen(
                              products = products,
                              targetMargin = targetMargin,
                              onDeleteProduct = { id ->
                                  val updated = products.filterNot { it.id == id }
                                  products = updated
                                  repository.saveProducts(updated)
                              }
                          )
                          NavTab.SETTING -> SettingScreen(
                              targetMargin = targetMargin,
                              onSaveTargetMargin = { newTarget ->
                                  targetMargin = newTarget
                                  repository.setTargetMargin(newTarget)
                              },
                              repository = repository,
                              onDataRestored = {
                                  products = repository.loadProducts()
                                  targetMargin = repository.getTargetMargin()
                              }
                          )
                      }
                  }
              }
          }

          // 1. SCREEN HOME (DASHBOARD)
          @Composable
          fun HomeScreen(
              products: List<ProductItem>,
              targetMargin: Double,
              onNavigateToHitung: () -> Unit,
              onNavigateToSimulator: () -> Unit
          ) {
              val results = remember(products, targetMargin) {
                  products.map { p ->
                      p to ProfitEngine.calculate(
                          sellingPrice = p.sellingPrice,
                          cogs = p.cogs,
                          marketplaceFeePercent = p.marketplaceFeePercent,
                          fixedFee = p.fixedFee,
                          packagingCost = p.packagingCost,
                          operationalCost = p.operationalCost,
                          returnReservePercent = p.returnReservePercent,
                          targetAds = p.targetAds,
                          targetAffiliatePercent = p.targetAffiliatePercent,
                          targetMarginDefault = targetMargin
                      )
                  }
              }

              val totalProfit = results.fold(BigDecimal.ZERO) { acc, pair -> acc.add(pair.second.netProfit) }
              val attentionCount = results.count { it.second.status != "SEHAT" }
              val topProduct = results.maxByOrNull { it.second.netProfit }?.first?.name?.replaceFirstChar { it.uppercase() } ?: "-"

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Ringkasan Profit Anda",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Spacer(Modifier.height(16.dp))

                  Row(modifier = Modifier.fillMaxWidth()) {
                      Card(
                          modifier = Modifier
                              .weight(1f)
                              .padding(end = 6.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Total Net Profit", fontSize = 12.sp, color = Color(0xFF2E7D32))
                              Spacer(Modifier.height(6.dp))
                              Text(
                                  ProfitEngine.formatRupiah(totalProfit),
                                  fontSize = 16.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (totalProfit >= BigDecimal.ZERO) Color(0xFF1B5E20) else Color(0xFFB71C1C)
                              )
                          }
                      }
                      Card(
                          modifier = Modifier
                              .weight(1f)
                              .padding(start = 6.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFE3F2FD)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Total Produk", fontSize = 12.sp, color = Color(0xFF1565C0))
                              Spacer(Modifier.height(6.dp))
                              Text("${products.size} Produk", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = Color(0xFF0D47A1))
                          }
                      }
                  }

                  Spacer(Modifier.height(12.dp))

                  Row(modifier = Modifier.fillMaxWidth()) {
                      Card(
                          modifier = Modifier
                              .weight(1f)
                              .padding(end = 6.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF8E1)),
                          shape = RoundedCornerShape(12.dp)
                          ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Perlu Perhatian", fontSize = 12.sp, color = Color(0xFFE65100))
                              Spacer(Modifier.height(6.dp))
                              Text("$attentionCount Item", fontSize = 16.sp, fontWeight = FontWeight.Bold, color = Color(0xFFBF360C))
                          }
                      }
                      Card(
                          modifier = Modifier
                              .weight(1f)
                              .padding(start = 6.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFF3F4F6)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("Profit Tertinggi", fontSize = 12.sp, color = Color(0xFF4B5563))
                              Spacer(Modifier.height(6.dp))
                              Text(topProduct, fontSize = 16.sp, fontWeight = FontWeight.Bold, color = Color(0xFF1F2937))
                          }
                      }
                  }

                  Spacer(Modifier.height(24.dp))
                  Text(
                      text = "Aksi Cepat",
                      fontSize = 18.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Spacer(Modifier.height(12.dp))

                  Row(modifier = Modifier.fillMaxWidth()) {
                      Button(
                          onClick = onNavigateToHitung,
                          modifier = Modifier
                              .weight(1f)
                              .height(48.dp)
                              .padding(end = 6.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B)),
                          shape = RoundedCornerShape(24.dp)
                      ) {
                          Text("+ Hitung Profit", fontWeight = FontWeight.SemiBold)
                      }
                      OutlinedButton(
                          onClick = onNavigateToSimulator,
                          modifier = Modifier
                              .weight(1f)
                              .height(48.dp)
                              .padding(start = 6.dp),
                          shape = RoundedCornerShape(24.dp)
                      ) {
                          Text("Simulator", color = Color(0xFF006D5B), fontWeight = FontWeight.SemiBold)
                      }
                  }
                  Spacer(Modifier.height(40.dp))
              }
          }

          // 2. SCREEN HITUNG (AFFILIATE % & FULL SCROLL)
          @Composable
          fun HitungScreen(
              targetMargin: Double,
              onSaveProduct: (ProductItem) -> Unit
          ) {
              var name by remember { mutableStateOf("") }
              var priceText by remember { mutableStateOf("") }
              var cogsText by remember { mutableStateOf("") }
              var feeText by remember { mutableStateOf("6.5") }
              var fixedText by remember { mutableStateOf("1000") }
              var packingText by remember { mutableStateOf("2000") }
              var opsText by remember { mutableStateOf("1500") }
              var returText by remember { mutableStateOf("2.0") }
              var adsText by remember { mutableStateOf("5000") }
              var affPercentText by remember { mutableStateOf("5.0") } // Default 5%

              val context = LocalContext.current

              val price = priceText.toDoubleOrNull() ?: 0.0
              val cogs = cogsText.toDoubleOrNull() ?: 0.0
              val fee = feeText.toDoubleOrNull() ?: 0.0
              val fixed = fixedText.toDoubleOrNull() ?: 0.0
              val packing = packingText.toDoubleOrNull() ?: 0.0
              val ops = opsText.toDoubleOrNull() ?: 0.0
              val retur = returText.toDoubleOrNull() ?: 0.0
              val ads = adsText.toDoubleOrNull() ?: 0.0
              val affPercent = affPercentText.toDoubleOrNull() ?: 0.0

              val result = remember(price, cogs, fee, fixed, packing, ops, retur, ads, affPercent, targetMargin) {
                  ProfitEngine.calculate(
                      sellingPrice = price,
                      cogs = cogs,
                      marketplaceFeePercent = fee,
                      fixedFee = fixed,
                      packagingCost = packing,
