                              value = targetInput,
                              onValueChange = { targetInput = it },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )
                          Spacer(Modifier.height(12.dp))
                          Button(
                              onClick = {
                                  val parsed = targetInput.toDoubleOrNull()
                                  if (parsed != null && parsed >= 0.0) {
                                      onSaveTargetMargin(parsed)
                                      Toast.makeText(context, "Target margin disimpan!", Toast.LENGTH_SHORT).show()
                                  } else {
                                      Toast.makeText(context, "Masukkan angka margin yang valid!", Toast.LENGTH_SHORT).show()
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B)),
                              shape = RoundedCornerShape(8.dp)
                          ) {
                              Text("Simpan Target")
                          }
                      }
                  }

                  Spacer(Modifier.height(16.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFF1F5F9)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(
                              "Backup & Restore (Offline)",
                              fontWeight = FontWeight.SemiBold,
                              fontSize = 14.sp,
                              color = Color(0xFF334155)
                          )
                          Spacer(Modifier.height(12.dp))
                          Row(modifier = Modifier.fillMaxWidth()) {
                              Button(
                                  onClick = {
                                      backupJsonText = repository.getRawJson()
                                      showBackupDialog = true
                                  },
                                  modifier = Modifier
                                      .weight(1f)
                                      .padding(end = 4.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B)),
                                  shape = RoundedCornerShape(8.dp)
                              ) {
                                  Text("Backup Data", fontSize = 13.sp)
                              }
                              OutlinedButton(
                                  onClick = {
                                      backupJsonText = ""
                                      showBackupDialog = true
                                  },
                                  modifier = Modifier
                                      .weight(1f)
                                      .padding(start = 4.dp),
                                  shape = RoundedCornerShape(8.dp)
                              ) {
                                  Text("Restore Data", fontSize = 13.sp, color = Color(0xFF006D5B))
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(16.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFF8FAFC)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(
                              "Profit Control V1.0.2",
                              fontWeight = FontWeight.Bold,
                              fontSize = 14.sp,
                              color = Color(0xFF1E293B)
                          )
                          Spacer(Modifier.height(4.dp))
                          Text(
                              "Semua data tersimpan otomatis di memori internal HP Anda secara offline. Data tidak akan hilang saat aplikasi ditutup.",
                              fontSize = 12.sp,
                              color = Color(0xFF64748B),
                              lineHeight = 16.sp
                          )
                      }
                  }

                  Spacer(Modifier.height(120.dp))
              }

              if (showBackupDialog) {
                  AlertDialog(
                      onDismissRequest = { showBackupDialog = false },
                      title = { Text("Backup / Restore Data") },
                      text = {
                          Column {
                              Text(
                                  "Salin teks di bawah untuk cadangan, atau tempel teks JSON lama untuk memulihkan data:",
                                  fontSize = 12.sp,
                                  color = Color(0xFF64748B)
                              )
                              Spacer(Modifier.height(8.dp))
                              OutlinedTextField(
                                  value = backupJsonText,
                                  onValueChange = { backupJsonText = it },
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .height(150.dp),
                                  textStyle = androidx.compose.ui.text.TextStyle(fontSize = 11.sp)
                              )
                              Spacer(Modifier.height(6.dp))
                              Row(horizontalArrangement = Arrangement.End, modifier = Modifier.fillMaxWidth()) {
                                  TextButton(onClick = {
                                      clipboardManager.setText(AnnotatedString(backupJsonText))
                                      Toast.makeText(context, "Teks disalin ke clipboard!", Toast.LENGTH_SHORT).show()
                                  }) {
                                      Text("Salin Teks", fontSize = 12.sp)
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  if (backupJsonText.isNotBlank()) {
                                      val ok = repository.restoreRawJson(backupJsonText)
                                      if (ok) {
                                          onDataRestored()
                                          Toast.makeText(context, "Data berhasil dipulihkan!", Toast.LENGTH_SHORT).show()
                                          showBackupDialog = false
                                      } else {
                                          Toast.makeText(context, "Format JSON tidak valid!", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B))
                          ) {
                              Text("Terapkan")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showBackupDialog = false }) {
                              Text("Tutup")
                          }
                      }
                  )
              }
          }
          EOF

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew || true
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitControl-V1.0.2-AffiliatePercent
          path: app/build/outputs/apk/debug/app-debug.apk
