          @Composable
          fun SimulasiScreen(
              products: List<ProductItem>,
              targetMargin: BigDecimal,
              targetProfit: BigDecimal
          ) {
              var selectedProductIndex by remember { mutableIntStateOf(0) }
              var isDropdownExpanded by remember { mutableStateOf(false) }

              val baseProduct = products.getOrNull(selectedProductIndex)

              var simPriceText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.sellingPrice) } ?: "0") }
              var simCogsText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.cogs) } ?: "0") }
              var simPackText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.packagingCost) } ?: "0") }
              var simFeeText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatDecimal(it.marketplaceFeePercent) } ?: "0") }
              var simFixedText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.fixedFee) } ?: "0") }
              var simVoucherText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.voucherCost) } ?: "0") }
              var simAffText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatDecimal(it.targetAffiliatePercent) } ?: "0") }
              var simAdsText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.targetAds) } ?: "0") }
              var simOtherText by remember(baseProduct) { mutableStateOf(baseProduct?.let { ProfitEngine.formatNumber(it.otherCost) } ?: "0") }

              val beforeResult = remember(baseProduct, targetMargin, targetProfit) {
                  baseProduct?.let {
                      ProfitEngine.calculate(
                          sellingPrice = it.sellingPrice,
                          unitsSold = it.unitsSold,
                          cogs = it.cogs,
                          packagingCost = it.packagingCost,
                          marketplaceFeePercent = it.marketplaceFeePercent,
                          fixedFee = it.fixedFee,
                          voucherCost = it.voucherCost,
                          targetAffiliatePercent = it.targetAffiliatePercent,
                          targetAds = it.targetAds,
                          otherCost = it.otherCost,
                          targetMarginPercent = targetMargin,
                          targetProfitPerOrder = targetProfit
                      )
                  }
              }

              val afterResult by remember(baseProduct, simPriceText, simCogsText, simPackText, simFeeText, simFixedText, simVoucherText, simAffText, simAdsText, simOtherText, targetMargin, targetProfit) {
                  derivedStateOf {
                      baseProduct?.let {
                          val p = ProfitEngine.parseBigDecimal(simPriceText)
                          val c = ProfitEngine.parseBigDecimal(simCogsText)
                          val pk = ProfitEngine.parseBigDecimal(simPackText)
                          val f = ProfitEngine.parsePercent(simFeeText)
                          val fx = ProfitEngine.parseBigDecimal(simFixedText)
                          val v = ProfitEngine.parseBigDecimal(simVoucherText)
                          val af = ProfitEngine.parsePercent(simAffText)
                          val a = ProfitEngine.parseBigDecimal(simAdsText)
                          val o = ProfitEngine.parseBigDecimal(simOtherText)

                          ProfitEngine.calculate(
                              sellingPrice = p,
                              unitsSold = it.unitsSold,
                              cogs = c,
                              packagingCost = pk,
                              marketplaceFeePercent = f,
                              fixedFee = fx,
                              voucherCost = v,
                              targetAffiliatePercent = af,
                              targetAds = a,
                              otherCost = o,
                              targetMarginPercent = targetMargin,
                              targetProfitPerOrder = targetProfit
                          )
                      }
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Simulator Biaya & SOT",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Text(
                      text = "Uji skenario kenaikan fee admin, voucher, atau iklan terhadap profit toko.",
                      fontSize = 13.sp,
                      color = Color(0xFF64748B)
                  )
                  Spacer(Modifier.height(14.dp))

                  if (products.isEmpty()) {
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF3E0))
                      ) {
                          Text(
                              "Belum ada produk tersimpan. Silakan input produk terlebih dahulu di menu Hitung.",
                              modifier = Modifier.padding(16.dp),
                              color = Color(0xFFE65100)
                          )
                      }
                  } else {
                      Box(modifier = Modifier.fillMaxWidth()) {
                          OutlinedButton(
                              onClick = { isDropdownExpanded = true },
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(8.dp)
                          ) {
                              Text("Target: ${baseProduct?.name ?: "-"}", color = Color(0xFF006D5B), fontWeight = FontWeight.Bold)
                          }
                          DropdownMenu(
                              expanded = isDropdownExpanded,
                              onDismissRequest = { isDropdownExpanded = false }
                          ) {
                              products.forEachIndexed { idx, p ->
                                  DropdownMenuItem(
                                      text = { Text(p.name) },
                                      onClick = {
                                          selectedProductIndex = idx
                                          isDropdownExpanded = false
                                      }
                                  )
                              }
                          }
                      }

                      Spacer(Modifier.height(12.dp))

                      OutlinedTextField(
                          value = simPriceText,
                          onValueChange = { simPriceText = it },
                          label = { Text("Harga Jual Simulasi (Rp)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                          modifier = Modifier.fillMaxWidth(),
                          singleLine = true
                      )

                      Spacer(Modifier.height(8.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          OutlinedTextField(
                              value = simCogsText,
                              onValueChange = { simCogsText = it },
                              label = { Text("HPP (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(end = 4.dp),
                              singleLine = true
                          )
                          OutlinedTextField(
                              value = simPackText,
                              onValueChange = { simPackText = it },
                              label = { Text("Packaging (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(start = 4.dp),
                              singleLine = true
                          )
                      }

                      Spacer(Modifier.height(8.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          OutlinedTextField(
                              value = simFeeText,
                              onValueChange = { simFeeText = it },
                              label = { Text("Marketplace Fee (%)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.weight(1f).padding(end = 4.dp),
                              singleLine = true
                          )
                          OutlinedTextField(
                              value = simFixedText,
                              onValueChange = { simFixedText = it },
                              label = { Text("Fixed Fee (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(start = 4.dp),
                              singleLine = true
                          )
                      }

                      Spacer(Modifier.height(8.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          OutlinedTextField(
                              value = simVoucherText,
                              onValueChange = { simVoucherText = it },
                              label = { Text("Voucher (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(end = 4.dp),
                              singleLine = true
                          )
                          OutlinedTextField(
                              value = simAffText,
                              onValueChange = { simAffText = it },
                              label = { Text("Affiliate (%)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.weight(1f).padding(start = 4.dp),
                              singleLine = true
                          )
                      }

                      Spacer(Modifier.height(8.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          OutlinedTextField(
                              value = simAdsText,
                              onValueChange = { simAdsText = it },
                              label = { Text("Iklan / Order (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(end = 4.dp),
                              singleLine = true
                          )
                          OutlinedTextField(
                              value = simOtherText,
                              onValueChange = { simOtherText = it },
                              label = { Text("Other Cost (Rp)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.weight(1f).padding(start = 4.dp),
                              singleLine = true
                          )
                      }

                      Spacer(Modifier.height(16.dp))

                      Row(modifier = Modifier.fillMaxWidth()) {
                          Card(
                              modifier = Modifier.weight(1f).padding(end = 4.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFFF8FAFC)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text("SEBELUM", fontSize = 11.sp, color = Color(0xFF64748B), fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      beforeResult?.let { ProfitEngine.formatRupiah(it.profitPerOrder) } ?: "-",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 15.sp
                                  )
                                  Text("Margin: ${beforeResult?.marginPercent ?: 0}%", fontSize = 12.sp, color = Color(0xFF64748B))
                                  Text("Status: ${beforeResult?.status ?: "-"}", fontSize = 11.sp, fontWeight = FontWeight.SemiBold)
                                  Text("Total: ${beforeResult?.let { ProfitEngine.formatRupiah(it.totalNetProfit) } ?: "-"}", fontSize = 11.sp, color = Color(0xFF64748B))
                              }
                          }

                          Card(
                              modifier = Modifier.weight(1f).padding(start = 4.dp),
                              colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text("SESUDAH", fontSize = 11.sp, color = Color(0xFF2E7D32), fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      afterResult?.let { ProfitEngine.formatRupiah(it.profitPerOrder) } ?: "-",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 15.sp,
                                      color = Color(0xFF1B5E20)
                                  )
                                  Text("Margin: ${afterResult?.marginPercent ?: 0}%", fontSize = 12.sp, color = Color(0xFF2E7D32))
                                  Text("Status: ${afterResult?.status ?: "-"}", fontSize = 11.sp, fontWeight = FontWeight.SemiBold, color = Color(0xFF1B5E20))
                                  Text("Total: ${afterResult?.let { ProfitEngine.formatRupiah(it.totalNetProfit) } ?: "-"}", fontSize = 11.sp, color = Color(0xFF2E7D32))
                              }
                          }
                      }

                      Spacer(Modifier.height(14.dp))

                      val diffProfit = if (beforeResult != null && afterResult != null) {
                          afterResult!!.profitPerOrder.subtract(beforeResult.profitPerOrder)
                      } else {
                          BigDecimal.ZERO
                      }

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          colors = CardDefaults.cardColors(
                              containerColor = if (diffProfit >= BigDecimal.ZERO) Color(0xFFE8F5E9) else Color(0xFFFFEBEE)
                          ),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(14.dp)) {
                              Text("DAMPAK PERUBAHAN PER ORDER", fontSize = 11.sp, fontWeight = FontWeight.Bold, color = Color(0xFF334155))
                              Spacer(Modifier.height(4.dp))
                              val sign = if (diffProfit > BigDecimal.ZERO) "+" else ""
                              Text(
                                  "Selisih Profit / Order: $sign${ProfitEngine.formatRupiah(diffProfit)}",
                                  fontSize = 16.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (diffProfit >= BigDecimal.ZERO) Color(0xFF2E7D32) else Color(0xFFC62828)
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(130.dp))
              }
          }

          @Composable
          fun ProdukScreen(
              products: List<ProductItem>,
              targetMargin: BigDecimal,
              targetProfit: BigDecimal,
              onDeleteProduct: (String) -> Unit,
              onUpdateProduct: (ProductItem) -> Unit
          ) {
              var selectedFilter by remember { mutableStateOf("SEMUA") }
              var editingProduct by remember { mutableStateOf<ProductItem?>(null) }
              var productToDelete by remember { mutableStateOf<ProductItem?>(null) }

              val calculatedList = remember(products, targetMargin, targetProfit) {
                  products.map { p ->
                      p to ProfitEngine.calculate(
                          sellingPrice = p.sellingPrice,
                          unitsSold = p.unitsSold,
                          cogs = p.cogs,
                          packagingCost = p.packagingCost,
                          marketplaceFeePercent = p.marketplaceFeePercent,
                          fixedFee = p.fixedFee,
                          voucherCost = p.voucherCost,
                          targetAffiliatePercent = p.targetAffiliatePercent,
                          targetAds = p.targetAds,
                          otherCost = p.otherCost,
                          targetMarginPercent = targetMargin,
                          targetProfitPerOrder = targetProfit
                      )
                  }
              }

              val filteredList = calculatedList.filter { pair ->
                  when (selectedFilter) {
                      "SEHAT" -> pair.second.status == "PROFIT SEHAT"
                      "TIPIS" -> pair.second.status == "PROFIT TIPIS"
                      "BONCOS" -> pair.second.status == "BONCOS"
                      else -> true
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Daftar Produk (${products.size})",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Spacer(Modifier.height(12.dp))

                  Row(modifier = Modifier.fillMaxWidth()) {
                      listOf("SEMUA", "SEHAT", "TIPIS", "BONCOS").forEach { filter ->
                          val isSelected = selectedFilter == filter
                          Button(
                              onClick = { selectedFilter = filter },
                              modifier = Modifier.weight(1f).padding(horizontal = 2.dp).height(36.dp),
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = if (isSelected) Color(0xFF006D5B) else Color(0xFFE2E8F0)
                              ),
                              contentPadding = PaddingValues(0.dp)
                          ) {
                              Text(
                                  filter,
                                  fontSize = 11.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = if (isSelected) Color.White else Color(0xFF475569)
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(12.dp))

                  if (filteredList.isEmpty()) {
                      Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Text("Tidak ada produk dalam kategori ini.", color = Color(0xFF94A3B8))
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.fillMaxSize(),
                          contentPadding = PaddingValues(bottom = 120.dp)
                      ) {
                          items(filteredList, key = { it.first.id }) { (product, calc) ->
                              val (badgeBg, badgeText) = when (calc.status) {
                                  "PROFIT SEHAT" -> Color(0xFF2E7D32) to "SEHAT"
                                  "PROFIT TIPIS" -> Color(0xFFE65100) to "TIPIS"
                                  else -> Color(0xFFC62828) to "BONCOS"
                              }

                              Card(
                                  modifier = Modifier.fillMaxWidth().padding(vertical = 6.dp),
                                  colors = CardDefaults.cardColors(containerColor = Color.White),
                                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Column(modifier = Modifier.padding(14.dp)) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.SpaceBetween,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              product.name.replaceFirstChar { it.uppercase() },
                                              fontSize = 16.sp,
                                              fontWeight = FontWeight.Bold
                                          )
                                          Surface(
                                              color = badgeBg,
                                              shape = RoundedCornerShape(6.dp)
                                          ) {
                                              Text(
                                                  badgeText,
                                                  color = Color.White,
                                                  modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),
                                                  fontWeight = FontWeight.Bold,
                                                  fontSize = 11.sp
                                              )
                                          }
                                      }

                                      Spacer(Modifier.height(4.dp))
                                      Text(
                                          "Harga: ${ProfitEngine.formatRupiah(product.sellingPrice)} | Margin: ${calc.marginPercent}%",
                                          fontSize = 13.sp,
                                          color = Color(0xFF64748B)
                                      )
                                      Spacer(Modifier.height(2.dp))
                                      Text(
                                          "Profit/Order: ${ProfitEngine.formatRupiah(calc.profitPerOrder)} | Total (${product.unitsSold} Unit): ${ProfitEngine.formatRupiah(calc.totalNetProfit)}",
                                          fontSize = 13.sp,
                                          fontWeight = FontWeight.Bold,
                                          color = if (calc.profitPerOrder >= BigDecimal.ZERO) Color(0xFF2E7D32) else Color(0xFFC62828)
                                      )

                                      Spacer(Modifier.height(6.dp))
                                      Row(
                                          modifier = Modifier.fillMaxWidth(),
                                          horizontalArrangement = Arrangement.End,
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Text(
                                              "Edit",
                                              color = Color(0xFF006D5B),
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier.clickable { editingProduct = product }.padding(8.dp)
                                          )
                                          Spacer(Modifier.width(8.dp))
                                          Text(
                                              "Hapus",
                                              color = Color(0xFFC62828),
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier.clickable { productToDelete = product }.padding(8.dp)
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              productToDelete?.let { prod ->
                  AlertDialog(
                      onDismissRequest = { productToDelete = null },
                      title = { Text("Konfirmasi Hapus") },
                      text = { Text("Hapus produk '${prod.name}'? Data yang dihapus tidak bisa dikembalikan.") },
                      confirmButton = {
                          Button(
                              onClick = {
                                  onDeleteProduct(prod.id)
                                  productToDelete = null
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828))
                          ) {
                              Text("Hapus")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { productToDelete = null }) {
                              Text("Batal")
                          }
                      }
                  )
              }

              editingProduct?.let { prod ->
                  var editName by remember { mutableStateOf(prod.name) }
                  var editPrice by remember { mutableStateOf(ProfitEngine.formatNumber(prod.sellingPrice)) }
                  var editUnits by remember { mutableStateOf(prod.unitsSold.toString()) }
                  var editCogs by remember { mutableStateOf(ProfitEngine.formatNumber(prod.cogs)) }
                  var editPack by remember { mutableStateOf(ProfitEngine.formatNumber(prod.packagingCost)) }
                  var editFee by remember { mutableStateOf(ProfitEngine.formatDecimal(prod.marketplaceFeePercent)) }
                  var editFixed by remember { mutableStateOf(ProfitEngine.formatNumber(prod.fixedFee)) }
                  var editVoucher by remember { mutableStateOf(ProfitEngine.formatNumber(prod.voucherCost)) }
                  var editAff by remember { mutableStateOf(ProfitEngine.formatDecimal(prod.targetAffiliatePercent)) }
                  var editAds by remember { mutableStateOf(ProfitEngine.formatNumber(prod.targetAds)) }
                  var editOther by remember { mutableStateOf(ProfitEngine.formatNumber(prod.otherCost)) }

                  AlertDialog(
                      onDismissRequest = { editingProduct = null },
                      title = { Text("Edit Produk SOT") },
                      text = {
                          Column(modifier = Modifier.verticalScroll(rememberScrollState())) {
                              OutlinedTextField(value = editName, onValueChange = { editName = it }, label = { Text("Nama Produk") }, modifier = Modifier.fillMaxWidth())
                              Spacer(Modifier.height(4.dp))
                              Row {
                                  OutlinedTextField(value = editPrice, onValueChange = { editPrice = it }, label = { Text("Harga Jual") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1.3f).padding(end = 4.dp))
                                  OutlinedTextField(value = editUnits, onValueChange = { editUnits = it }, label = { Text("Unit") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(0.7f).padding(start = 4.dp))
                              }
                              Spacer(Modifier.height(4.dp))
                              Row {
                                  OutlinedTextField(value = editCogs, onValueChange = { editCogs = it }, label = { Text("HPP") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1f).padding(end = 4.dp))
                                  OutlinedTextField(value = editPack, onValueChange = { editPack = it }, label = { Text("Packaging") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1f).padding(start = 4.dp))
                              }
                              Spacer(Modifier.height(4.dp))
                              Row {
                                  OutlinedTextField(value = editFee, onValueChange = { editFee = it }, label = { Text("Fee (%)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.weight(1f).padding(end = 4.dp))
                                  OutlinedTextField(value = editFixed, onValueChange = { editFixed = it }, label = { Text("Fixed Fee") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1f).padding(start = 4.dp))
                              }
                              Spacer(Modifier.height(4.dp))
                              Row {
                                  OutlinedTextField(value = editVoucher, onValueChange = { editVoucher = it }, label = { Text("Voucher (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1f).padding(end = 4.dp))
                                  OutlinedTextField(value = editAff, onValueChange = { editAff = it }, label = { Text("Affiliate (%)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal), modifier = Modifier.weight(1f).padding(start = 4.dp))
                              }
                              Spacer(Modifier.height(4.dp))
                              Row {
                                  OutlinedTextField(value = editAds, onValueChange = { editAds = it }, label = { Text("Iklan (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1f).padding(end = 4.dp))
                                  OutlinedTextField(value = editOther, onValueChange = { editOther = it }, label = { Text("Other (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.weight(1f).padding(start = 4.dp))
                              }
                          }
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  val p = ProfitEngine.parseBigDecimal(editPrice)
                                  if (editName.isNotBlank() && p.compareTo(BigDecimal.ZERO) > 0) {
                                      onUpdateProduct(
                                          ProductItem(
                                              id = prod.id,
                                              name = editName.trim(),
                                              sellingPrice = p,
                                              unitsSold = ProfitEngine.parseUnits(editUnits),
                                              cogs = ProfitEngine.parseBigDecimal(editCogs),
                                              packagingCost = ProfitEngine.parseBigDecimal(editPack),
                                              marketplaceFeePercent = ProfitEngine.parsePercent(editFee),
                                              fixedFee = ProfitEngine.parseBigDecimal(editFixed),
                                              voucherCost = ProfitEngine.parseBigDecimal(editVoucher),
                                              targetAffiliatePercent = ProfitEngine.parsePercent(editAff),
                                              targetAds = ProfitEngine.parseBigDecimal(editAds),
                                              otherCost = ProfitEngine.parseBigDecimal(editOther)
                                          )
                                      )
                                      editingProduct = null
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B))
                          ) {
                              Text("Simpan Perubahan")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { editingProduct = null }) {
                              Text("Batal")
                          }
                      }
                  )
              }
          }

          @Composable
          fun SettingScreen(
              targetMargin: BigDecimal,
              targetProfit: BigDecimal,
              onSaveTargetMargin: (BigDecimal) -> Unit,
              onSaveTargetProfit: (BigDecimal) -> Unit,
              repository: ProfitRepository,
              onDataRestored: () -> Unit
          ) {
              var marginInput by remember(targetMargin) { mutableStateOf(ProfitEngine.formatDecimal(targetMargin)) }
              var profitInput by remember(targetProfit) { mutableStateOf(ProfitEngine.formatNumber(targetProfit)) }
              var showBackupDialog by remember { mutableStateOf(false) }
              var backupJsonText by remember { mutableStateOf("") }
              val clipboardManager = LocalClipboardManager.current
              val context = LocalContext.current

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(
                      text = "Pengaturan & Panduan",
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold,
                      color = Color(0xFF1E293B)
                  )
                  Spacer(Modifier.height(16.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFE8F5E9)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(
                              "Panduan Singkat 3 Langkah SOT",
                              fontWeight = FontWeight.Bold,
                              fontSize = 15.sp,
                              color = Color(0xFF1B5E20)
                          )
                          Spacer(Modifier.height(8.dp))
                          Text("1. Input produk di menu Hitung beserta modal, admin fee, voucher, dan biaya lainnya.", fontSize = 12.sp, color = Color(0xFF2E7D32))
                          Spacer(Modifier.height(4.dp))
                          Text("2. Perhatikan Harga Minimum dan Batas Aman Iklan (Max Ads) yang mengunci target profit Anda.", fontSize = 12.sp, color = Color(0xFF2E7D32))
                          Spacer(Modifier.height(4.dp))
                          Text("3. Gunakan menu Simulasi jika marketplace menaikkan komisi agar toko tidak boncos.", fontSize = 12.sp, color = Color(0xFF2E7D32))
                      }
                  }

                  Spacer(Modifier.height(14.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFF1F5F9)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("Target Margin & Profit SOT", fontWeight = FontWeight.SemiBold, fontSize = 14.sp, color = Color(0xFF334155))
                          Spacer(Modifier.height(8.dp))

                          OutlinedTextField(
                              value = marginInput,
                              onValueChange = { marginInput = it },
                              label = { Text("Target Margin Default (%)") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )
                          Spacer(Modifier.height(8.dp))

                          OutlinedTextField(
                              value = profitInput,
                              onValueChange = { profitInput = it },
                              label = { Text("Target Profit / Order (Rp) [Untuk Safe Limits]") },
                              keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                              modifier = Modifier.fillMaxWidth(),
                              singleLine = true
                          )

                          Spacer(Modifier.height(12.dp))
                          Button(
                              onClick = {
                                  val pMargin = ProfitEngine.parsePercent(marginInput)
                                  val pProfit = ProfitEngine.parseBigDecimal(profitInput)
                                  if (pMargin.compareTo(BigDecimal.ZERO) >= 0 && pProfit.compareTo(BigDecimal.ZERO) >= 0) {
                                      onSaveTargetMargin(pMargin)
                                      onSaveTargetProfit(pProfit)
                                      Toast.makeText(context, "Target Margin & Profit berhasil disimpan!", Toast.LENGTH_SHORT).show()
                                  } else {
                                      Toast.makeText(context, "Masukkan nilai target yang valid!", Toast.LENGTH_SHORT).show()
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B)),
                              shape = RoundedCornerShape(8.dp)
                          ) {
                              Text("Simpan Target SOT")
                          }
                      }
                  }

                  Spacer(Modifier.height(14.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFF1F5F9)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("Backup & Restore (Offline)", fontWeight = FontWeight.SemiBold, fontSize = 14.sp, color = Color(0xFF334155))
                          Spacer(Modifier.height(12.dp))
                          Row(modifier = Modifier.fillMaxWidth()) {
                              Button(
                                  onClick = {
                                      backupJsonText = repository.getRawJson()
                                      showBackupDialog = true
                                  },
                                  modifier = Modifier.weight(1f).padding(end = 4.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B)),
                                  shape = RoundedCornerShape(8.dp)
                              ) {
                                  Text("Backup Data", fontSize = 13.sp)
                              }
                              OutlinedButton(
                                  onClick = {
                                      backupJsonText = ""
                                      showBackupDialog = true
                                  },
                                  modifier = Modifier.weight(1f).padding(start = 4.dp),
                                  shape = RoundedCornerShape(8.dp)
                              ) {
                                  Text("Restore Data", fontSize = 13.sp, color = Color(0xFF006D5B))
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(14.dp))

                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFF8FAFC)),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("Profit Control V1.0.6 (Production Release)", fontWeight = FontWeight.Bold, fontSize = 14.sp, color = Color(0xFF1E293B))
                          Spacer(Modifier.height(4.dp))
                          Text("100% Offline. Dilengkapi kalkulator Harga Minimum dan Safe Limits sesuai SOT.", fontSize = 12.sp, color = Color(0xFF64748B))
                      }
                  }

                  Spacer(Modifier.height(120.dp))
              }

              if (showBackupDialog) {
                  AlertDialog(
                      onDismissRequest = { showBackupDialog = false },
                      title = { Text("Backup / Restore Data") },
                      text = {
                          Column {
                              Text(
                                  "Salin teks di bawah untuk cadangan, atau tempel teks JSON lama untuk memulihkan data:",
                                  fontSize = 12.sp,
                                  color = Color(0xFF64748B)
                              )
                              Spacer(Modifier.height(8.dp))
                              OutlinedTextField(
                                  value = backupJsonText,
                                  onValueChange = { backupJsonText = it },
                                  modifier = Modifier.fillMaxWidth().height(150.dp),
                                  textStyle = androidx.compose.ui.text.TextStyle(fontSize = 11.sp)
                              )
                              Spacer(Modifier.height(6.dp))
                              Row(horizontalArrangement = Arrangement.End, modifier = Modifier.fillMaxWidth()) {
                                  TextButton(onClick = {
                                      clipboardManager.setText(AnnotatedString(backupJsonText))
                                      Toast.makeText(context, "Teks disalin ke clipboard!", Toast.LENGTH_SHORT).show()
                                  }) {
                                      Text("Salin Teks", fontSize = 12.sp)
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          Button(
                              onClick = {
                                  if (backupJsonText.isNotBlank()) {
                                      val ok = repository.restoreRawJson(backupJsonText)
                                      if (ok) {
                                          onDataRestored()
                                          Toast.makeText(context, "Data berhasil dipulihkan!", Toast.LENGTH_SHORT).show()
                                          showBackupDialog = false
                                      } else {
                                          Toast.makeText(context, "Format JSON tidak valid!", Toast.LENGTH_SHORT).show()
                                      }
                                  }
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF006D5B))
                          ) {
                              Text("Terapkan")
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { showBackupDialog = false }) {
                              Text("Tutup")
                          }
                      }
                  )
              }
          }
          EOF

      - name: Build Android Production Signed Release APK
        run: |
          chmod +x gradlew || true
          gradle assembleRelease --stacktrace

      - name: Verify Production Release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            exit 1
          fi
          echo "SUCCESS: Production Release APK built successfully at $APK_PATH"

      - name: Upload Production Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitControl-V1.0.6-ProductionRelease
          path: app/build/outputs/apk/release/app-release.apk
