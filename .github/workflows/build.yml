name: Build Profit Control V1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Scaffold Complete Android Project & Source Code
        run: |
          mkdir -p app/src/main/java/com/profitcontrol/app
          mkdir -p app/src/main/res/values

          # 1. Root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ProfitControl"
          include(":app")
          EOF

          # 2. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 3. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.profitcontrol.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.profitcontrol.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Profit Control"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Core Engine
          cat << 'EOF' > app/src/main/java/com/profitcontrol/app/ProfitEngine.kt
          package com.profitcontrol.app

          import java.math.BigDecimal
          import java.math.RoundingMode

          data class ProductInput(
              val id: String = java.util.UUID.randomUUID().toString(),
              val name: String,
              val sellingPrice: BigDecimal,
              val cogs: BigDecimal,
              val marketplaceFeePercent: BigDecimal,
              val fixedFee: BigDecimal,
              val packagingCost: BigDecimal,
              val operationalCost: BigDecimal,
              val returnReservePercent: BigDecimal,
              val targetAdsBudget: BigDecimal,
              val targetAffiliateCommission: BigDecimal
          )

          data class CalculationResult(
              val totalFeeNominal: BigDecimal,
              val netRevenue: BigDecimal,
              val profitBeforeAds: BigDecimal,
              val netProfit: BigDecimal,
              val netProfitMarginPercent: BigDecimal,
              val bepRoas: BigDecimal,
              val maxSafeAdsBudget: BigDecimal,
              val maxSafeAffiliateNominal: BigDecimal,
              val status: String
          )

          object ProfitEngine {
              private val HUNDRED = BigDecimal("100")
              private val ZERO = BigDecimal.ZERO

              fun calculate(input: ProductInput): CalculationResult {
                  val price = input.sellingPrice
                  
                  val feeMarketplace = price.multiply(input.marketplaceFeePercent).divide(HUNDRED, 2, RoundingMode.HALF_UP)
                  val returnReserve = price.multiply(input.returnReservePercent).divide(HUNDRED, 2, RoundingMode.HALF_UP)
                  val totalDeductions = feeMarketplace.add(input.fixedFee).add(returnReserve)
                  
                  val netRevenue = price.subtract(totalDeductions)
                  val totalBaseCost = input.cogs.add(input.packagingCost).add(input.operationalCost)
                  
                  val profitBeforeAds = netRevenue.subtract(totalBaseCost)
                  val netProfit = profitBeforeAds.subtract(input.targetAdsBudget).subtract(input.targetAffiliateCommission)
                  
                  val netMargin = if (price.compareTo(ZERO) > 0) {
                      netProfit.multiply(HUNDRED).divide(price, 2, RoundingMode.HALF_UP)
                  } else ZERO

                  val bepRoas = if (profitBeforeAds.compareTo(ZERO) > 0) {
                      price.divide(profitBeforeAds, 2, RoundingMode.HALF_UP)
                  } else ZERO

                  val maxAds = if (profitBeforeAds.compareTo(ZERO) > 0) profitBeforeAds.subtract(input.targetAffiliateCommission) else ZERO
                  val maxAffiliate = if (profitBeforeAds.compareTo(ZERO) > 0) profitBeforeAds.subtract(input.targetAdsBudget) else ZERO

                  val status = when {
                      netProfit.compareTo(ZERO) < 0 -> "BONCOS"
                      netMargin.compareTo(BigDecimal("15")) >= 0 -> "SEHAT"
                      else -> "TIPIS"
                  }

                  return CalculationResult(
                      totalFeeNominal = totalDeductions,
                      netRevenue = netRevenue,
                      profitBeforeAds = profitBeforeAds,
                      netProfit = netProfit,
                      netProfitMarginPercent = netMargin,
                      bepRoas = bepRoas,
                      maxSafeAdsBudget = if (maxAds.compareTo(ZERO) > 0) maxAds else ZERO,
                      maxSafeAffiliateNominal = if (maxAffiliate.compareTo(ZERO) > 0) maxAffiliate else ZERO,
                      status = status
                  )
              }
          }
          EOF

          # 6. Repository
          cat << 'EOF' > app/src/main/java/com/profitcontrol/app/ProfitRepository.kt
          package com.profitcontrol.app

          import android.content.Context
          import com.google.gson.Gson
          import com.google.gson.reflect.TypeToken
          import java.io.File
          import java.io.FileOutputStream

          class ProfitRepository(private val context: Context) {
              private val fileName = "profit_products_v1.json"
              private val gson = Gson()

              @Synchronized
              fun saveProducts(products: List<ProductInput>): Boolean {
                  return try {
                      val file = File(context.filesDir, fileName)
                      val tempFile = File(context.filesDir, "$fileName.tmp")
                      val jsonString = gson.toJson(products)

                      FileOutputStream(tempFile).use { fos ->
                          fos.write(jsonString.toByteArray(Charsets.UTF_8))
                          fos.flush()
                      }
                      tempFile.renameTo(file)
                  } catch (e: Exception) {
                      e.printStackTrace()
                      false
                  }
              }

              @Synchronized
              fun loadProducts(): List<ProductInput> {
                  return try {
                      val file = File(context.filesDir, fileName)
                      if (!file.exists()) return emptyList()
                      val jsonString = file.readText(Charsets.UTF_8)
                      val type = object : TypeToken<List<ProductInput>>() {}.type
                      gson.fromJson(jsonString, type) ?: emptyList()
                  } catch (e: Exception) {
                      e.printStackTrace()
                      emptyList()
                  }
              }

              fun exportJson(): String {
                  val list = loadProducts()
                  return gson.toJson(list)
              }

              fun importJson(json: String): Boolean {
                  return try {
                      val type = object : TypeToken<List<ProductInput>>() {}.type
                      val list: List<ProductInput> = gson.fromJson(json, type)
                      saveProducts(list)
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          EOF

          # 7. UI Jetpack Compose (Basis Sukses Teruji)
          cat << 'EOF' > app/src/main/java/com/profitcontrol/app/MainActivity.kt
          package com.profitcontrol.app

          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.math.BigDecimal

          class MainActivity : ComponentActivity() {
              private lateinit var repo: ProfitRepository

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  repo = ProfitRepository(applicationContext)

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              MainAppScreen(repo)
                          }
                      }
                  }
              }
          }

          @Composable
          fun MainAppScreen(repo: ProfitRepository) {
              var selectedTab by remember { mutableIntStateOf(0) }
              var productList by remember { mutableStateOf(repo.loadProducts()) }

              Column(modifier = Modifier.fillMaxSize()) {
                  TabRow(selectedTabIndex = selectedTab) {
                      Tab(selected = selectedTab == 0, onClick = { selectedTab = 0 }, text = { Text("Hitung", fontSize = 12.sp) })
                      Tab(selected = selectedTab == 1, onClick = { selectedTab = 1 }, text = { Text("List (${productList.size})", fontSize = 12.sp) })
                      Tab(selected = selectedTab == 2, onClick = { selectedTab = 2 }, text = { Text("Backup", fontSize = 12.sp) })
                  }

                  when (selectedTab) {
                      0 -> ProfitCalculatorScreen(onSave = { newProd ->
                          val updated = productList.filter { it.id != newProd.id } + newProd
                          if (repo.saveProducts(updated)) {
                              productList = updated
                          }
                      })
                      1 -> ProductListScreen(
                          products = productList,
                          onDelete = { prod ->
                              val updated = productList.filter { it.id != prod.id }
                              if (repo.saveProducts(updated)) {
                                  productList = updated
                              }
                          }
                      )
                      2 -> BackupRestoreScreen(repo, onReload = {
                          productList = repo.loadProducts()
                      })
                  }
              }
          }

          @Composable
          fun ProfitCalculatorScreen(onSave: (ProductInput) -> Unit) {
              val context = LocalContext.current
              var name by remember { mutableStateOf("") }
              var price by remember { mutableStateOf("") }
              var cogs by remember { mutableStateOf("") }
              var feePct by remember { mutableStateOf("6.5") }
              var fixedFee by remember { mutableStateOf("1000") }
              var packCost by remember { mutableStateOf("2000") }
              var opCost by remember { mutableStateOf("1500") }
              var returnPct by remember { mutableStateOf("2") }
              var adsBudget by remember { mutableStateOf("5000") }
              var affComm by remember { mutableStateOf("0") }

              val calcResult by remember(name, price, cogs, feePct, fixedFee, packCost, opCost, returnPct, adsBudget, affComm) {
                  derivedStateOf {
                      val p = price.toBigDecimalOrNull() ?: BigDecimal.ZERO
                      val c = cogs.toBigDecimalOrNull() ?: BigDecimal.ZERO
                      if (p > BigDecimal.ZERO && c > BigDecimal.ZERO) {
                          val input = ProductInput(
                              name = name.ifEmpty { "Produk" },
                              sellingPrice = p,
                              cogs = c,
                              marketplaceFeePercent = feePct.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                              fixedFee = fixedFee.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                              packagingCost = packCost.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                              operationalCost = opCost.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                              returnReservePercent = returnPct.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                              targetAdsBudget = adsBudget.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                              targetAffiliateCommission = affComm.toBigDecimalOrNull() ?: BigDecimal.ZERO
                          )
                          ProfitEngine.calculate(input)
                      } else null
                  }
              }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  item {
                      Text("Kalkulator Profit Riil V1", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(4.dp))
                  }
                  item { OutlinedTextField(value = name, onValueChange = { name = it }, label = { Text("Nama Produk") }, modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = price, onValueChange = { price = it }, label = { Text("Harga Jual (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = cogs, onValueChange = { cogs = it }, label = { Text("HPP / Modal Produk (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = feePct, onValueChange = { feePct = it }, label = { Text("Biaya Admin Marketplace (%)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = fixedFee, onValueChange = { fixedFee = it }, label = { Text("Biaya Transaksi Tetap (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = packCost, onValueChange = { packCost = it }, label = { Text("Biaya Packing (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = opCost, onValueChange = { opCost = it }, label = { Text("Biaya Operasional (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = returnPct, onValueChange = { returnPct = it }, label = { Text("Cadangan Retur (%)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = adsBudget, onValueChange = { adsBudget = it }, label = { Text("Alokasi Iklan per Order (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }
                  item { OutlinedTextField(value = affComm, onValueChange = { affComm = it }, label = { Text("Komisi Affiliate (Rp)") }, keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number), modifier = Modifier.fillMaxWidth()) }

                  calcResult?.let { res ->
                      item {
                          Card(
                              modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp),
                              colors = CardDefaults.cardColors(
                                  containerColor = when (res.status) {
                                      "SEHAT" -> Color(0xFFE8F5E9)
                                      "TIPIS" -> Color(0xFFFFF9C4)
                                      else -> Color(0xFFFFEBEE)
                                  }
                              )
                          ) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Text("STATUS: ${res.status}", fontWeight = FontWeight.ExtraBold, fontSize = 18.sp, color = when (res.status) {
                                      "SEHAT" -> Color(0xFF2E7D32)
                                      "TIPIS" -> Color(0xFFF57F17)
                                      else -> Color(0xFFC62828)
                                  })
                                  Text("Profit Bersih: Rp ${res.netProfit} (${res.netProfitMarginPercent}%)")
                                  Text("Profit Sebelum Iklan: Rp ${res.profitBeforeAds}")
                                  Text("BEP ROAS Minimal: ${res.bepRoas}x")
                                  Text("Batas Aman Biaya Iklan: Rp ${res.maxSafeAdsBudget}")
                                  Text("Batas Aman Komisi Affiliate: Rp ${res.maxSafeAffiliateNominal}")
                              }
                          }
                      }
                      item {
                          Button(
                              onClick = {
                                  val input = ProductInput(
                                      name = name.ifEmpty { "Produk Baru" },
                                      sellingPrice = price.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      cogs = cogs.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      marketplaceFeePercent = feePct.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      fixedFee = fixedFee.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      packagingCost = packCost.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      operationalCost = opCost.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      returnReservePercent = returnPct.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      targetAdsBudget = adsBudget.toBigDecimalOrNull() ?: BigDecimal.ZERO,
                                      targetAffiliateCommission = affComm.toBigDecimalOrNull() ?: BigDecimal.ZERO
                                  )
                                  onSave(input)
                                  Toast.makeText(context, "Produk tersimpan!", Toast.LENGTH_SHORT).show()
                              },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Text("Simpan ke Data Lokal (Anti-Hilang)")
                          }
                      }
                  }
                  // Spacer bawah agar nyaman di-scroll
                  item { Spacer(modifier = Modifier.height(40.dp)) }
              }
          }

          @Composable
          fun ProductListScreen(products: List<ProductInput>, onDelete: (ProductInput) -> Unit) {
              if (products.isEmpty()) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Text("Belum ada data tersimpan.")
                  }
              } else {
                  LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(products) { prod ->
                          val res = ProfitEngine.calculate(prod)
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Row(modifier = Modifier.padding(12.dp).fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(prod.name, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                      Text("Jual: Rp ${prod.sellingPrice} | HPP: Rp ${prod.cogs}")
                                      Text("Net Profit: Rp ${res.netProfit} (${res.status})", color = if (res.status == "BONCOS") Color.Red else Color(0xFF2E7D32))
                                  }
                                  IconButton(onClick = { onDelete(prod) }) {
                                      Text("Hapus", color = Color.Red, fontSize = 12.sp)
                                  }
                              }
                          }
                      }
                      item { Spacer(modifier = Modifier.height(40.dp)) }
                  }
              }
          }

          @Composable
          fun BackupRestoreScreen(repo: ProfitRepository, onReload: () -> Unit) {
              val context = LocalContext.current
              var jsonText by remember { mutableStateOf(repo.exportJson()) }
              var message by remember { mutableStateOf("") }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Text("Backup & Restore Data Lokal (JSON)", fontWeight = FontWeight.Bold, fontSize = 18.sp)
                  OutlinedTextField(
                      value = jsonText,
                      onValueChange = { jsonText = it },
                      label = { Text("Format Teks Data JSON") },
                      modifier = Modifier.fillMaxWidth().height(200.dp)
                  )
                  Button(onClick = {
                      if (repo.importJson(jsonText)) {
                          message = "Data berhasil di-restore!"
                          Toast.makeText(context, "Data berhasil di-restore!", Toast.LENGTH_SHORT).show()
                          onReload()
                      } else {
                          message = "Gagal memproses format JSON."
                      }
                  }, modifier = Modifier.fillMaxWidth()) {
                      Text("Restore / Terapkan Data JSON")
                  }
                  if (message.isNotEmpty()) {
                      Text(message, color = MaterialTheme.colorScheme.primary, fontWeight = FontWeight.Bold)
                  }
              }
          }
          EOF

      - name: Generate Gradle Wrapper & Build APK
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProfitControl-V1-Stable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
