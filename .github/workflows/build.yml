name: Build Profit Control Production Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Android Project Structure, Keystore & Assets
        run: |
          mkdir -p app/src/main/java/com/profitcontrol/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # Generate Dedicated Production Release Keystore
          keytool -genkeypair -v -keystore app/release.jks -alias profitcontrol -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "ProfitControlKey2026!" -keypass "ProfitControlKey2026!" \
            -dname "CN=Profit Control, OU=Production, O=Karyaku.id, L=Jember, ST=East Java, C=ID"

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ProfitControl"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.profitcontrol.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.profitcontrol.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 7
                  versionName = "1.0.6"

                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.jks")
                      storePassword = "ProfitControlKey2026!"
                      keyAlias = "profitcontrol"
                      keyPassword = "ProfitControlKey2026!"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isDebuggable = false
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.02.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("com.google.code.gson:gson:2.10.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M0,0h108v108h-108z"
                  android:fillColor="#005B4C"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,70 L42,70 L42,54 L34,54 Z M48,70 L56,70 L56,44 L48,44 Z M62,70 L70,70 L70,36 L62,36 Z M30,76 L76,76 L76,72 L30,72 Z"/>
              <path
                  android:strokeColor="#A7F3D0"
                  android:strokeWidth="3.5"
                  android:strokeLineCap="round"
                  android:pathData="M34,48 L48,36 L60,44 L74,30"/>
              <path
                  android:fillColor="#A7F3D0"
                  android:pathData="M70,30 L76,30 L76,36 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Profit Control"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:theme="@android:style/Theme.Material.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Profit Control</string>
          </resources>
          EOF

      - name: Inject Source Code V1.0.6 (Full SOT Implementation)
        run: |
          cat << 'EOF' > app/src/main/java/com/profitcontrol/app/MainActivity.kt
          package com.profitcontrol.app

          import android.content.Context
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Home
          import androidx.compose.material.icons.filled.List
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.google.gson.Gson
          import com.google.gson.JsonDeserializationContext
          import com.google.gson.JsonDeserializer
          import com.google.gson.JsonElement
          import com.google.gson.GsonBuilder
          import com.google.gson.reflect.TypeToken
          import java.io.File
          import java.lang.reflect.Type
          import java.math.BigDecimal
          import java.math.RoundingMode
          import java.text.NumberFormat
          import java.util.Locale
          import java.util.UUID

          data class ProductItem(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val sellingPrice: BigDecimal,
              val unitsSold: Long,
              val cogs: BigDecimal,
              val packagingCost: BigDecimal,
              val marketplaceFeePercent: BigDecimal,
              val fixedFee: BigDecimal,
              val voucherCost: BigDecimal,
              val targetAffiliatePercent: BigDecimal,
              val targetAds: BigDecimal,
              val otherCost: BigDecimal
          )

          data class CalculationResult(
              val marketplaceFeeNominal: BigDecimal,
              val affiliateNominal: BigDecimal,
              val totalCostPerOrder: BigDecimal,
              val profitPerOrder: BigDecimal,
              val totalNetProfit: BigDecimal,
              val marginPercent: BigDecimal,
              val profitBeforeAds: BigDecimal,
              val bepRoas: BigDecimal?,
              val isBepRoasFeasible: Boolean,
              val minimumSellingPrice: BigDecimal?,
              val isMinPriceFeasible: Boolean,
              val maxAdsLimit: BigDecimal,
              val isMaxAdsFeasible: Boolean,
              val maxAffiliatePercentLimit: BigDecimal,
              val isMaxAffiliateFeasible: Boolean,
              val status: String
          )

          object ProfitEngine {
              private val HUNDRED = BigDecimal("100")

              fun parseBigDecimal(text: String): BigDecimal {
                  val cleaned = text.replace(".", "").replace(",", ".").trim()
                  return cleaned.toBigDecimalOrNull() ?: BigDecimal.ZERO
              }

              fun parsePercent(text: String): BigDecimal {
                  val cleaned = text.replace(",", ".").trim()
                  return cleaned.toBigDecimalOrNull() ?: BigDecimal.ZERO
              }

              fun parseUnits(text: String): Long {
                  val cleaned = text.replace(".", "").replace(",", "").trim()
                  val num = cleaned.toLongOrNull() ?: 1L
                  return if (num <= 0L) 1L else num
              }

              fun calculate(
                  sellingPrice: BigDecimal,
                  unitsSold: Long,
                  cogs: BigDecimal,
                  packagingCost: BigDecimal,
                  marketplaceFeePercent: BigDecimal,
                  fixedFee: BigDecimal,
                  voucherCost: BigDecimal,
                  targetAffiliatePercent: BigDecimal,
                  targetAds: BigDecimal,
                  otherCost: BigDecimal,
                  targetMarginPercent: BigDecimal = BigDecimal("20"),
                  targetProfitPerOrder: BigDecimal = BigDecimal.ZERO
              ): CalculationResult {
                  val price = sellingPrice.setScale(4, RoundingMode.HALF_UP)
                  val units = if (unitsSold <= 0L) 1L else unitsSold

                  // 1. Marketplace Fee & Affiliate Fee
                  val adminPercentFraction = marketplaceFeePercent.divide(HUNDRED, 8, RoundingMode.HALF_UP)
                  val marketplaceFeeNominal = price.multiply(adminPercentFraction).setScale(2, RoundingMode.HALF_UP)

                  val affPercentFraction = targetAffiliatePercent.divide(HUNDRED, 8, RoundingMode.HALF_UP)
                  val affiliateNominal = price.multiply(affPercentFraction).setScale(2, RoundingMode.HALF_UP)

                  // 2. Total Cost / Order
                  val totalCostPerOrder = cogs
                      .add(packagingCost)
                      .add(marketplaceFeeNominal)
                      .add(fixedFee)
                      .add(voucherCost)
                      .add(affiliateNominal)
                      .add(targetAds)
                      .add(otherCost)
                      .setScale(2, RoundingMode.HALF_UP)

                  // 3. Profit / Order & Total Net Profit
                  val profitPerOrder = price.subtract(totalCostPerOrder).setScale(2, RoundingMode.HALF_UP)
                  val totalNetProfit = profitPerOrder.multiply(BigDecimal.valueOf(units)).setScale(2, RoundingMode.HALF_UP)

                  // 4. Margin %
                  val marginPercent = if (price.compareTo(BigDecimal.ZERO) > 0) {
                      profitPerOrder.divide(price, 6, RoundingMode.HALF_UP).multiply(HUNDRED).setScale(2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO.setScale(2, RoundingMode.HALF_UP)
                  }

                  // 5. Profit Before Ads
                  val costsExcludingAds = totalCostPerOrder.subtract(targetAds)
                  val profitBeforeAds = price.subtract(costsExcludingAds).setScale(2, RoundingMode.HALF_UP)

                  // 6. BEP ROAS (Selling Price / Profit Before Ads)
                  val isBepRoasFeasible = profitBeforeAds.compareTo(BigDecimal.ZERO) > 0 && price.compareTo(BigDecimal.ZERO) > 0
                  val bepRoas = if (isBepRoasFeasible) {
                      price.divide(profitBeforeAds, 2, RoundingMode.HALF_UP)
                  } else {
                      null
                  }

                  // 7. Status Profit
                  val status = when {
                      profitPerOrder.compareTo(BigDecimal.ZERO) <= 0 -> "BONCOS"
                      marginPercent.compareTo(targetMarginPercent) >= 0 -> "PROFIT SEHAT"
                      else -> "PROFIT TIPIS"
                  }

                  // 8. Minimum Selling Price
                  // Total Biaya Tetap = HPP + Packaging + Fixed Fee + Voucher + Other Cost + Target Ads
                  val totalFixedCost = cogs
                      .add(packagingCost)
                      .add(fixedFee)
                      .add(voucherCost)
                      .add(otherCost)
                      .add(targetAds)

                  val denomPercent = HUNDRED
                      .subtract(marketplaceFeePercent)
                      .subtract(targetAffiliatePercent)
                      .subtract(targetMarginPercent)

                  val isMinPriceFeasible = denomPercent.compareTo(BigDecimal.ZERO) > 0
                  val minimumSellingPrice = if (isMinPriceFeasible) {
                      totalFixedCost.multiply(HUNDRED).divide(denomPercent, 2, RoundingMode.HALF_UP)
                  } else {
                      null
                  }

                  // 9. Safe Limits: Maximum Ads
                  val isMaxAdsFeasible = profitBeforeAds.compareTo(targetProfitPerOrder) >= 0
                  val maxAdsLimit = if (isMaxAdsFeasible) {
                      profitBeforeAds.subtract(targetProfitPerOrder).setScale(2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO.setScale(2, RoundingMode.HALF_UP)
                  }

                  // 10. Safe Limits: Maximum Affiliate %
                  // Non-Affiliate Costs = HPP + Packaging + Marketplace Fee + Fixed Fee + Voucher + Ads + Other Cost
                  val nonAffiliateCosts = cogs
                      .add(packagingCost)
                      .add(marketplaceFeeNominal)
                      .add(fixedFee)
                      .add(voucherCost)
                      .add(targetAds)
                      .add(otherCost)

                  val numerator = price.subtract(nonAffiliateCosts).subtract(targetProfitPerOrder)
                  val isMaxAffiliateFeasible = numerator.compareTo(BigDecimal.ZERO) >= 0 && price.compareTo(BigDecimal.ZERO) > 0
                  val maxAffiliatePercentLimit = if (isMaxAffiliateFeasible) {
                      numerator.divide(price, 6, RoundingMode.HALF_UP).multiply(HUNDRED).setScale(2, RoundingMode.HALF_UP)
                  } else {
                      BigDecimal.ZERO.setScale(2, RoundingMode.HALF_UP)
                  }

                  return CalculationResult(
                      marketplaceFeeNominal = marketplaceFeeNominal,
                      affiliateNominal = affiliateNominal,
                      totalCostPerOrder = totalCostPerOrder,
                      profitPerOrder = profitPerOrder,
                      totalNetProfit = totalNetProfit,
                      marginPercent = marginPercent,
                      profitBeforeAds = profitBeforeAds,
                      bepRoas = bepRoas,
                      isBepRoasFeasible = isBepRoasFeasible,
                      minimumSellingPrice = minimumSellingPrice,
                      isMinPriceFeasible = isMinPriceFeasible,
                      maxAdsLimit = maxAdsLimit,
                      isMaxAdsFeasible = isMaxAdsFeasible,
                      maxAffiliatePercentLimit = maxAffiliatePercentLimit,
                      isMaxAffiliateFeasible = isMaxAffiliateFeasible,
                      status = status
                  )
              }

              fun formatRupiah(amount: BigDecimal?): String {
                  if (amount == null) return "Rp 0"
                  val formatter = NumberFormat.getCurrencyInstance(Locale("in", "ID"))
                  formatter.maximumFractionDigits = 0
                  return formatter.format(amount).replace("Rp", "Rp ")
              }

              fun formatNumber(amount: BigDecimal): String {
                  return amount.setScale(0, RoundingMode.HALF_UP).toPlainString()
              }

              fun formatDecimal(amount: BigDecimal): String {
                  return amount.stripTrailingZeros().toPlainString()
              }
          }

          class ProductItemDeserializer : JsonDeserializer<ProductItem> {
              override fun deserialize(json: JsonElement, typeOfT: Type, context: JsonDeserializationContext): ProductItem {
                  val obj = json.asJsonObject
                  val id = if (obj.has("id")) obj.get("id").asString else UUID.randomUUID().toString()
                  val name = if (obj.has("name")) obj.get("name").asString else "Produk"

                  fun getBd(field: String, default: BigDecimal = BigDecimal.ZERO): BigDecimal {
                      if (!obj.has(field)) return default
                      return try {
                          BigDecimal(obj.get(field).asString)
                      } catch (e: Exception) {
                          try { BigDecimal.valueOf(obj.get(field).asDouble) } catch (_: Exception) { default }
                      }
                  }

                  val sellingPrice = getBd("sellingPrice")
                  val cogs = getBd("cogs")
                  val marketplaceFeePercent = getBd("marketplaceFeePercent", BigDecimal("6.5"))
                  val fixedFee = getBd("fixedFee", BigDecimal("1000"))
                  val packagingCost = getBd("packagingCost", BigDecimal("2000"))
                  val targetAds = getBd("targetAds", BigDecimal("5000"))
                  val targetAffiliatePercent = getBd("targetAffiliatePercent", BigDecimal("5"))

                  // Migrasi field SOT V1.0.6
                  val unitsSold = if (obj.has("unitsSold")) obj.get("unitsSold").asLong else 1L
                  val voucherCost = getBd("voucherCost", BigDecimal.ZERO)
                  val otherCost = if (obj.has("otherCost")) getBd("otherCost") else getBd("operationalCost", BigDecimal("1500"))

                  return ProductItem(
                      id = id,
                      name = name,
                      sellingPrice = sellingPrice,
                      unitsSold = if (unitsSold <= 0L) 1L else unitsSold,
                      cogs = cogs,
                      packagingCost = packagingCost,
                      marketplaceFeePercent = marketplaceFeePercent,
                      fixedFee = fixedFee,
                      voucherCost = voucherCost,
                      targetAffiliatePercent = targetAffiliatePercent,
                      targetAds = targetAds,
                      otherCost = otherCost
                  )
              }
          }

          class ProfitRepository(private val context: Context) {
              private val file = File(context.filesDir, "profit_control_db.json")
              private val pref = context.getSharedPreferences("profit_prefs", Context.MODE_PRIVATE)
              private val gson: Gson = GsonBuilder()
                  .registerTypeAdapter(ProductItem::class.java, ProductItemDeserializer())
                  .setPrettyPrinting()
                  .create()

              fun getTargetMargin(): BigDecimal {
                  val stored = pref.getString("target_margin_bd", "20") ?: "20"
                  return BigDecimal(stored)
              }

              fun setTargetMargin(margin: BigDecimal) {
                  pref.edit().putString("target_margin_bd", margin.toPlainString()).apply()
              }

              fun getTargetProfitPerOrder(): BigDecimal {
                  val stored = pref.getString("target_profit_bd", "10000") ?: "10000"
                  return BigDecimal(stored)
              }

              fun setTargetProfitPerOrder(profit: BigDecimal) {
                  pref.edit().putString("target_profit_bd", profit.toPlainString()).apply()
              }

              fun loadProducts(): List<ProductItem> {
                  return try {
                      if (!file.exists()) {
                          val sample = listOf(
                              ProductItem(
                                  name = "[CONTOH] Kaos Polos",
                                  sellingPrice = BigDecimal("85000"),
                                  unitsSold = 50L,
                                  cogs = BigDecimal("45000"),
                                  packagingCost = BigDecimal("2000"),
                                  marketplaceFeePercent = BigDecimal("6.5"),
                                  fixedFee = BigDecimal("1000"),
                                  voucherCost = BigDecimal("0"),
                                  targetAffiliatePercent = BigDecimal("5.0"),
                                  targetAds = BigDecimal("5000"),
                                  otherCost = BigDecimal("1500")
                              )
                          )
                          saveProducts(sample)
                          sample
                      } else {
                          val json = file.readText()
                          val type = object : TypeToken<List<ProductItem>>() {}.type
                          gson.fromJson<List<ProductItem>>(json, type) ?: emptyList()
                      }
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun saveProducts(products: List<ProductItem>) {
                  try {
                      val json = gson.toJson(products)
                      val temp = File(context.filesDir, "profit_control_db.tmp")
                      temp.writeText(json)
                      temp.renameTo(file)
                  } catch (_: Exception) {}
              }

              fun getRawJson(): String {
                  return if (file.exists()) file.readText() else "[]"
              }

              fun restoreRawJson(raw: String): Boolean {
                  return try {
                      val type = object : TypeToken<List<ProductItem>>() {}.type
                      val parsed: List<ProductItem> = gson.fromJson(raw, type)
                      saveProducts(parsed)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val repository = ProfitRepository(this)
                  setContent {
                      ProfitControlTheme {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              MainApp(repository)
                          }
                      }
                  }
              }
          }

          @Composable
          fun ProfitControlTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = Color(0xFF006D5B),
                      secondary = Color(0xFF26A69A),
                      background = Color(0xFFFBFDFD),
                      surface = Color(0xFFFFFFFF),
                      surfaceVariant = Color(0xFFF0F4F4),
                      error = Color(0xFFBA1A1A)
                  ),
                  content = content
              )
          }

          enum class NavTab(val title: String) {
              HOME("Home"),
              HITUNG("Hitung"),
              SIMULASI("Simulasi"),
              PRODUK("Produk"),
              SETTING("Setting")
          }

          @Composable
          fun MainApp(repository: ProfitRepository) {
              var currentTab by remember { mutableStateOf(NavTab.HOME) }
              var products by remember { mutableStateOf(repository.loadProducts()) }
              var targetMargin by remember { mutableStateOf(repository.getTargetMargin()) }
              var targetProfit by remember { mutableStateOf(repository.getTargetProfitPerOrder()) }

              val tabs = remember { listOf(NavTab.HOME, NavTab.HITUNG, NavTab.SIMULASI, NavTab.PRODUK, NavTab.SETTING) }

              Scaffold(
                  topBar = {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFF005B4C))
                              .padding(top = 36.dp, bottom = 14.dp, start = 16.dp, end = 16.dp)
                      ) {
                          Text(
                              text = "PROFIT CONTROL",
                              fontSize = 20.sp,
                              fontWeight = FontWeight.Bold,
                              color = Color.White
                          )
                          Text(
                              text = "Omzet besar belum tentu untung.",
                              fontSize = 12.sp,
                              color = Color(0xFFB2DFDB)
                          )
                      }
                  },
                  bottomBar = {
                      NavigationBar(
                          containerColor = Color.White,
                          tonalElevation = 6.dp
                      ) {
                          tabs.forEach { tab ->
                              NavigationBarItem(
                                  selected = currentTab == tab,
                                  onClick = { currentTab = tab },
                                  icon = {
                                      when (tab) {
                                          NavTab.HOME -> Icon(Icons.Default.Home, contentDescription = "Home")
                                          NavTab.HITUNG -> Icon(Icons.Default.Add, contentDescription = "Hitung")
                                          NavTab.SIMULASI -> Icon(Icons.Default.PlayArrow, contentDescription = "Simulasi")
                                          NavTab.PRODUK -> Icon(Icons.Default.List, contentDescription = "Produk")
                                          NavTab.SETTING -> Icon(Icons.Default.Settings, contentDescription = "Setting")
                                      }
                                  },
                                  label = {
                                      Text(
                                          text = tab.title,
                                          fontSize = 11.sp,
                                          fontWeight = if (currentTab == tab) FontWeight.Bold else FontWeight.Normal
                                      )
                                  },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = Color(0xFF006D5B),
                                      selectedTextColor = Color(0xFF006D5B),
                                      indicatorColor = Color(0xFFE0F2F1),
                                      unselectedIconColor = Color(0xFF757575),
                                      unselectedTextColor = Color(0xFF757575)
                                  )
                              )
                          }
                      }
                  }
              ) { innerPadding ->
                  Box(modifier = Modifier.padding(innerPadding)) {
                      when (currentTab) {
                          NavTab.HOME -> HomeScreen(
                              products = products,
                              targetMargin = targetMargin,
                              targetProfit = targetProfit,
                              onNavigateToHitung = { currentTab = NavTab.HITUNG },
                              onNavigateToSimulator = { currentTab = NavTab.SIMULASI }
                          )
                          NavTab.HITUNG -> HitungScreen(
                              targetMargin = targetMargin,
                              targetProfit = targetProfit,
                              onSaveProduct = { newProduct ->
                                  val updated = products + newProduct
                                  products = updated
                                  repository.saveProducts(updated)
                                  currentTab = NavTab.PRODUK
                              }
                          )
                          NavTab.SIMULASI -> SimulasiScreen(
                              products = products,
                              targetMargin = targetMargin,
                              targetProfit = targetProfit
                          )
                          NavTab.PRODUK -> ProdukScreen(
                              products = products,
                              targetMargin = targetMargin,
                              targetProfit = targetProfit,
                              onDeleteProduct = { id ->
                                  val updated = products.filterNot { it.id == id }
                                  products = updated
                                  repository.saveProducts(updated)
                              },
                              onUpdateProduct = { updatedProduct ->
                                  val updated = products.map { if (it.id == updatedProduct.id) updatedProduct else it }
                                  products = updated
                                  repository.saveProducts(updated)
                              }
                          )
                          NavTab.SETTING -> SettingScreen(
                              targetMargin = targetMargin,
                              targetProfit = targetProfit,
                              onSaveTargetMargin = { newTarget ->
                                  targetMargin = newTarget
                                  repository.setTargetMargin(newTarget)
                              },
                              onSaveTargetProfit = { newTargetProfit ->
                                  targetProfit = newTargetProfit
                                  repository.setTargetProfitPerOrder(newTargetProfit)
                              },
                              repository = repository,
                              onDataRestored = {
                                  products = repository.loadProducts()
                                  targetMargin = repository.getTargetMargin()
                                  targetProfit = repository.getTargetProfitPerOrder()
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun HomeScreen(
              products: List<ProductItem>,
              targetMargin: BigDecimal,
              targetProfit: BigDecimal,
              onNavigateToHitung: () -> Unit,
              onNavigateToSimulator: () -> Unit
          ) {
              val results = remember(products, targetMargin, targetProfit) {
                  products.map { p ->
                      p to ProfitEngine.calculate(
                          sellingPrice = p.sellingPrice,
                          unitsSold = p.unitsSold,
                          cogs = p.cogs,
                          packagingCost = p.packagingCost,
                          marketplaceFeePercent = p.marketplaceFeePercent,
                          fixedFee = p.fixedFee,
                          voucherCost = p.voucherCost,
                          targetAffiliatePercent = p.targetAffiliatePercent,
                          targetAds = p.targetAds,
                          otherCost = p.otherCost,
                          targetMarginPercent = targetMargin,
                          targetProfitPerOrder = targetProfit
                      )
                  }
              }

              val totalAccumulatedProfit = results.fold(BigDecimal.ZERO) { acc, pair -> acc.add(pair.second.totalNetProfit) }
              val attentionCount = results.count { it.second.status != "PROFIT SEHAT" }
